<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlepass Creator</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Add Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Battlepass Creator</div>
        </nav>
    </header>

    <main>
        <section class="battlepass-creator" x-data="battlepassCreator">
            <div class="controls">
                <button @click="addCheckpoint" class="btn primary">Add Checkpoint</button>
                <button @click="removeLastCheckpoint" class="btn secondary">Remove Last</button>
                <button @click="saveBattlepass" class="btn primary">Save Battlepass</button>
                <button @click="viewBattlepass" class="btn secondary">View Battlepass</button>
                <button @click="showLoadModal" class="btn primary">Load Battlepass</button>
            </div>

            <div class="progress-controls">
                <div class="level-control">
                    <label>Current XP:</label>
                    <input 
                        type="number" 
                        x-model.number="currentXP"
                        class="xp-edit"
                        min="0"
                        :max="maxXP"
                        @input="calculateProgress">
                    <span x-text="` / ${maxXP} XP`"></span>
                </div>
                <div class="level-info">
                    <span>Current Level: </span>
                    <span x-text="currentLevel"></span>
                    <span x-text="` / ${checkpoints.length - 1}`"></span>
                </div>
            </div>

            <div class="battlepass-container">
                <div class="progress-wrapper">
                    <div class="progress-bar">
                        <div class="progress-line"></div>
                        <div class="progress-fill" :style="`width: ${progressPercentage}%`"></div>
                        <template x-for="(checkpoint, index) in checkpoints" :key="index">
                            <div 
                                class="checkpoint" 
                                :class="{ 'completed': currentXP >= checkpoint.xpRequired }"
                                :style="`left: ${index * (100 / (checkpoints.length - 1))}%`"
                                @mouseover="showTooltip(index)"
                                @mouseout="hideTooltip(index)"
                                @click="editCheckpoint(index)">
                                <div class="checkpoint-marker"
                                    :data-shape="checkpoint.shape"
                                    :style="`background-color: ${checkpoint.color}`">
                                </div>
                                <div x-show="checkpoint.showTooltip" 
                                    class="checkpoint-tooltip">
                                    <h4 x-text="checkpoint.title"></h4>
                                    <p x-text="checkpoint.description"></p>
                                    <p class="reward" x-text="'Reward: ' + checkpoint.reward"></p>
                                    <p class="xp-required" x-text="`Required XP: ${checkpoint.xpRequired}`"></p>
                                    <p class="status" x-text="currentXP >= checkpoint.xpRequired ? 'Completed' : 'Locked'"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="xp-ruler">
                        <template x-for="(checkpoint, index) in checkpoints" :key="index">
                            <div class="xp-tick" :style="`left: ${index * (100 / (checkpoints.length - 1))}%`">
                                <div class="tick-line"></div>
                                <span class="tick-label" x-text="checkpoint.xpRequired"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Checkpoint Editor Modal -->
            <div x-show="showEditor" class="modal">
                <div class="modal-content">
                    <h3>Edit Checkpoint</h3>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" x-model="editingCheckpoint.title">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea x-model="editingCheckpoint.description"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Reward</label>
                        <input type="text" x-model="editingCheckpoint.reward">
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <input type="color" x-model="editingCheckpoint.color">
                    </div>
                    <div class="form-group">
                        <label>Shape</label>
                        <select x-model="editingCheckpoint.shape" class="shape-select">
                            <option value="circle">Circle</option>
                            <option value="diamond">Diamond</option>
                            <option value="star">Star</option>
                            <option value="square">Square</option>
                            <option value="hexagon">Hexagon</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>XP Required</label>
                        <input 
                            type="number" 
                            x-model.number="editingCheckpoint.xpRequired"
                            min="0"
                            :max="maxXP">
                    </div>
                    <div class="modal-buttons">
                        <button @click="deleteCheckpoint" class="btn danger">Delete</button>
                        <div class="modal-buttons-right">
                            <button @click="saveCheckpoint" class="btn primary">Save</button>
                            <button @click="closeEditor" class="btn secondary">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Load Battlepass Modal -->
            <div x-show="showLoader" class="modal">
                <div class="modal-content">
                    <h3>Load Battlepass</h3>
                    <div class="battlepass-list">
                        <template x-for="(pass, id) in savedBattlepasses" :key="id">
                            <div class="battlepass-item">
                                <div class="battlepass-info" @click="loadBattlepass(id)">
                                    <h4 x-text="pass.title"></h4>
                                    <p class="timestamp" x-text="formatDate(pass.createdAt)"></p>
                                </div>
                                <div class="battlepass-actions">
                                    <span class="checkpoint-count" x-text="`${pass.checkpoints.length} checkpoints`"></span>
                                    <button @click="deleteBattlepass(id)" class="btn-icon danger">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <div x-show="Object.keys(savedBattlepasses).length === 0" class="no-battlepasses">
                            No saved battlepasses found
                        </div>
                    </div>
                    <div class="modal-buttons">
                        <button @click="closeLoadModal" class="btn secondary">Close</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
